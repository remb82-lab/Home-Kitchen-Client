<head>

<style>
:root{--bg:#fbf7f1;--card:#fff;--ink:#222720;--muted:#70746d;--line:#e7ded1;--green:#4d693e;--green2:#edf4e8;--orange:#dd6e34;--red:#a74444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,input,textarea{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding:0 12px 88px}.page{display:none}.page.active{display:block}
header{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:14px 2px 10px}.logo{width:52px;height:52px;border:1px solid var(--line);background:#fff;border-radius:15px;display:grid;place-items:center}.logo img{width:42px;height:42px}.brand{font-family:Georgia,serif;color:#35502f;font-weight:700;font-size:24px;line-height:1}.tag{font-family:Georgia,serif;color:#c86a38;font-style:italic;font-size:12px;margin-top:4px}.cart{border:0;border-radius:14px;background:var(--green);color:#fff;padding:10px 12px;font-weight:900}.sticky{position:sticky;top:0;z-index:10;background:rgba(251,247,241,.97);backdrop-filter:blur(12px);padding:5px 0 8px}.search{width:100%;padding:12px 13px;border-radius:15px;border:1px solid var(--line);background:#fff;outline:none}.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding-top:8px}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.filter.active{background:var(--green);color:#fff;border-color:var(--green)}
.client-order-phone{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 11px;border:1px solid #d8e4d2;background:#f4f8f1;border-radius:14px}.client-order-phone__copy{min-width:0}.client-order-phone__label{display:block;font-size:9px;color:var(--muted);font-weight:850}.client-order-phone__number{display:block;margin-top:2px;color:#35502f;font-size:14px;font-weight:900;text-decoration:none}.client-order-phone__call{flex:0 0 auto;border:0;border-radius:11px;background:var(--green);color:#fff;text-decoration:none;padding:9px 11px;font-size:11px;font-weight:900}.client-order-phone--inline{margin:10px 0}.client-order-phone-host:empty{display:none}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 8px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.product{min-width:0;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer}.photo{width:100%;aspect-ratio:1.18/1;object-fit:cover;display:block}.pbody{padding:8px}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;background:var(--green2);color:var(--green);font-size:8px;font-weight:900}.badge.warn{background:#fff0e4;color:#b85e2e}.badge.bad{background:#f7e6e6;color:var(--red)}.ptitle{font-size:10.7px;font-weight:850;line-height:1.2;height:39px;overflow:hidden;margin:6px 0}.prices{display:grid;grid-template-columns:1fr;gap:3px}.price{border:1px solid #e1e9dc;background:#f7faf5;border-radius:10px;padding:7px 8px}.price span{display:block;font-size:8px;color:var(--muted);white-space:nowrap}.price b{font-size:12px;color:#38572f;white-space:nowrap}.price--primary{border-color:#cbdcc3;background:#f1f7ed}.bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.nav{border:0;background:transparent;color:#777;font-size:10px;font-weight:800;padding:4px}.nav i{font-style:normal;display:block;font-size:19px;margin-bottom:2px}.nav.active{color:var(--green)}
.detail-head{display:flex;align-items:center;justify-content:space-between;padding:12px 1px}.detail-head h3{font-size:14px;text-align:center;margin:0;max-width:76%}.back,.heart{border:0;background:transparent;font-size:22px}.detail-photo{width:calc(100% + 24px);margin-left:-12px;height:295px;object-fit:cover}.detail{padding:12px 2px}.detail h1{font-family:Georgia,serif;color:#34472e;font-size:27px;line-height:1.04;margin:8px 0 5px}.desc{font-size:13px;line-height:1.45;color:#666b63}.dprices{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0 9px}.dprice{border:1px solid #cbdcc3;border-radius:14px;padding:13px;text-align:center;background:#f1f7ed;color:var(--ink)}.dprice span{display:block;font-size:10px;color:#70766b}.dprice b{display:block;font-size:23px;margin-top:3px;color:#35502f}.weight-picker{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin:0 0 11px}.weight-picker__label{display:block;font-size:10px;font-weight:850;color:var(--muted);margin-bottom:7px}.weight-picker__options{display:grid;grid-template-columns:1fr 1fr;gap:7px}.weight-picker__options button{border:1px solid #d7e3cf;border-radius:11px;background:#fff;padding:10px;font-weight:900;color:#43513d}.weight-picker__options button.active{background:var(--green);border-color:var(--green);color:#fff}.info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;line-height:1.45;margin:9px 0;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1.45fr;gap:7px;margin-top:10px}.secondary,.primary,.share{border-radius:12px;padding:10px;font-weight:900}.secondary,.share{background:#fff;border:1px solid var(--line)}.primary{border:0;background:var(--green);color:#fff}
.cartitem{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;margin-bottom:7px}.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover}.cname{font-size:11px;font-weight:850}.small{font-size:9px;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:4px}.qty button{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:7px}.totalbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grand{font-size:21px;font-weight:900;color:var(--green)}.checkout{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;padding:13px;font-weight:900;margin-top:9px}.form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.form label{display:block;font-size:10px;color:var(--muted);margin-bottom:8px}.form input,.form textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.profile-refresh{width:100%;margin-top:2px}.order{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px}.ok{width:78px;height:78px;border-radius:50%;background:#e9f4df;display:grid;place-items:center;font-size:40px;color:var(--green);margin:24px auto 12px}.thanks{text-align:center}.empty{text-align:center;padding:28px;color:var(--muted)}.hk-orders-empty{display:flex;flex-direction:column;align-items:center;gap:8px}.hk-orders-empty b{font-size:17px;color:var(--ink)}.hk-orders-empty span{font-size:12px}.hk-orders-empty .checkout{max-width:260px}.notice{background:#fff5e4;border:1px solid #ecd6ae;border-radius:13px;padding:11px;font-size:11px;line-height:1.4}.error{background:#f9eaea;border:1px solid #e7c2c2;color:#8e3f3f}.statusline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px}.refresh{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:10px;font-weight:800}
@media(max-width:420px){.app{padding-left:8px;padding-right:8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pbody{padding:8px}.ptitle{font-size:12px}.price b{font-size:13px}.badge,.price span{font-size:9px}.brand{font-size:21px}.cart,.back,.heart,.share,.qty button,.refresh,.weight-picker__options button{min-width:44px;min-height:44px}.filter,.nav{min-height:44px}}
</style>
</head>
<body>
<div class="app">
<section id="catalog" class="page active"><header><div class="logo"><img src="assets/branding/home-kitchen-mark.svg" alt=""></div><div><div class="brand">Домашняя кухня</div><div class="tag">С любовью как дома ♡</div></div><button class="cart" onclick="openCart()">🛒 <span id="cartCount">0</span></button></header><div class="sticky"><div id="clientOrderPhone" class="client-order-phone-host" aria-live="polite"></div><input id="q" class="search" placeholder="Поиск по каталогу…" oninput="renderCatalog()"><div id="filters" class="filters"></div></div><div class="section-head"><h2 id="catTitle">Каталог</h2><span id="catCount"></span></div><div id="grid" class="grid"></div></section>
<section id="detail" class="page"><div id="detailContent"></div></section>
<section id="orders" class="page"><div class="detail-head"><button class="back" onclick="go('catalog')">‹</button><h3>Мои заказы</h3><span></span></div><div id="ordersList"></div></section>
<section id="profile" class="page"><div class="detail-head"><button class="back" onclick="go('catalog')">‹</button><h3>Профиль</h3><span></span></div><div class="form"><label>Имя<input id="pname" autocomplete="name"></label><label>Телефон / мессенджер<input id="pphone" autocomplete="tel"></label><button class="checkout" onclick="saveProfile()">Сохранить</button><button class="secondary profile-refresh" type="button" onclick="loadProducts()">Обновить каталог</button></div></section>
<section id="cartPage" class="page"><div id="cartContent"></div></section><section id="checkoutPage" class="page"><div id="checkoutContent"></div></section><section id="successPage" class="page"><div id="successContent"></div></section>
</div>
<nav class="bottom"><button class="nav active" data-page="catalog" onclick="go('catalog')"><i>▦</i>Каталог</button><button class="nav" data-page="orders" onclick="go('orders')"><i>🧾</i>Заказы</button><button class="nav" data-page="profile" onclick="go('profile')"><i>👤</i>Профиль</button></nav>
