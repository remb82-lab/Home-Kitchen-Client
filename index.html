<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Домашняя кухня · Клиент</title>
<style>
:root{--hk-primary:#1f5a47;--hk-primary-pressed:#174536;--hk-primary-soft:#e7f1e6;--hk-cream:#f7f3e9;--hk-surface:#fffdf8;--hk-text:#25312b;--hk-muted:#5b665f;--hk-line:#e2dccf;--hk-danger:#9f2f2a;--hk-accent:#94491d;--hk-radius:16px;--hk-radius-sm:12px;--hk-space:12px;--hk-shadow:0 6px 20px rgba(31,90,71,.08);--hk-focus:rgba(31,90,71,.35);--hk-nav-h:64px;--hk-font-serif:Georgia,"Times New Roman",serif;--hk-font-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--hk-cream);color:var(--hk-text);font-family:var(--hk-font-sans);font-size:16px;line-height:1.4}button,input,textarea{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding:0 12px 96px}.page{display:none}.page.active{display:block}
</style>
<link rel="stylesheet" href="./premium-client.css?v=hk-ux-20261112">
</head>
<body>
<div class="app">
<section id="catalog" class="page active">
<header class="topbar"><div class="logo">⌂</div><div class="topbar__brand"><div class="brand">Домашняя кухня</div><div class="tag">С любовью как дома ♡</div></div><div class="topbar__actions"><div id="clientOrderPhone" class="client-order-phone-host" aria-live="polite"></div><button class="cart" type="button" onclick="openCart()">🛒 <span id="cartCount">0</span></button></div></header>
<div class="sticky"><input id="q" class="search" type="search" enterkeyhint="search" autocomplete="off" placeholder="Поиск по каталогу…" aria-label="Поиск по каталогу" oninput="renderCatalog()"><div id="filters" class="filters"></div></div>
<div class="section-head"><h2 id="catTitle">Каталог</h2><span id="catCount"></span></div><div id="grid" class="grid"></div></section>
<section id="detail" class="page"><div id="detailContent"></div></section>
<section id="orders" class="page"><div class="detail-head"><button class="back" type="button" onclick="go('catalog')">‹</button><h3>Мои заказы</h3><span></span></div><div id="ordersList"></div></section>
<section id="profile" class="page"><div class="detail-head"><button class="back" type="button" onclick="go('catalog')">‹</button><h3>Профиль</h3><span></span></div>
<p class="page-lead">Имя и контакт хранятся только на этом телефоне и подставляются при оформлении заказа. Мы не создаём аккаунт.</p>
<div class="form"><label for="pname">Имя<input id="pname" name="name" type="text" autocomplete="name" autocapitalize="words"></label><label for="pphone">Телефон или мессенджер<input id="pphone" name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="+375 29 123-45-67"></label><button class="checkout" type="button" onclick="saveProfile()">Сохранить</button></div>
<div class="profile-block"><h4>Связь с кухней</h4><div id="profileContact"></div></div>
<div class="profile-block" data-hk-install-block><h4>Приложение на телефоне</h4><p>Открывается без адресной строки браузера, с иконкой на экране.</p><button class="secondary" type="button" data-hk-install-open>Установить приложение</button><p id="hk-install-help" class="field-hint" hidden></p></div>
<button class="quiet-action profile-refresh" type="button" onclick="refreshCatalog(this)">Обновить каталог</button></section>
<section id="cartPage" class="page"><div id="cartContent"></div></section>
<section id="checkoutPage" class="page"><div id="checkoutContent"></div></section>
<section id="successPage" class="page"><div id="successContent"></div></section>
</div>
<nav class="bottom" aria-label="Основная навигация"><button class="nav active" data-page="catalog" onclick="go('catalog')"><i>▦</i>Каталог</button><button class="nav" data-page="orders" onclick="go('orders')"><i>🧾</i>Заказы</button><button class="nav" data-page="profile" onclick="go('profile')"><i>👤</i>Профиль</button></nav>
<script src="./security/turnstile.js?v=hk-ux-20261112"></script>
<script src="./premium-client-adapter.js?v=hk-ux-20261112"></script>
</body></html>
