<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf6ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Домашняя кухня</title>
<style>
:root{--bg:#faf6ee;--card:#fffdf8;--ink:#242a22;--muted:#747970;--line:#e7ded1;--green:#4c6a3f;--green2:#edf4e8;--orange:#c96d3c;--red:#a84a4a;--shadow:0 8px 28px rgba(53,71,46,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding:0 14px 100px}.page{display:none}.page.active{display:block}
header{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:18px 0 12px}.logo{width:58px;height:58px;border:1px solid var(--line);background:#fff;border-radius:18px;display:grid;place-items:center;font-size:29px;color:var(--green);box-shadow:var(--shadow)}.brand{font-family:Georgia,serif;color:#35502f;font-weight:700;font-size:27px;line-height:1}.tag{font-family:Georgia,serif;color:var(--orange);font-style:italic;font-size:13px;margin-top:5px}.cartbtn{border:0;border-radius:16px;background:var(--green);color:#fff;padding:12px 14px;font-weight:900;font-size:15px}
.sticky{position:sticky;top:0;z-index:10;background:rgba(250,246,238,.96);backdrop-filter:blur(12px);padding:4px 0 10px}.status{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);padding:4px 2px 9px}.dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;margin-right:6px}.dot.ok{background:#5f8a4e}.dot.bad{background:#bd5858}.refresh{border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px 10px;font-size:11px;font-weight:800}.search{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;outline:none;font-size:16px}.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding-top:9px}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:#62685f}.filter.active{background:var(--green);color:#fff;border-color:var(--green)}
.head{display:flex;justify-content:space-between;align-items:end;margin:17px 2px 10px}.head h2{font-size:21px;margin:0}.head span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.photo,.fallback{width:100%;aspect-ratio:1.25/1;display:block;object-fit:cover;background:linear-gradient(145deg,#f7faf3,#dfe9da)}.fallback{display:grid;place-items:center;font-size:46px}.pbody{padding:10px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--green2);color:var(--green);font-size:9px;font-weight:900}.ptitle{font-size:13px;font-weight:850;line-height:1.28;min-height:50px;margin:7px 0}.prices{display:grid;grid-template-columns:1fr 1fr;gap:5px}.price{background:#fff;border:1px solid #ebeee7;border-radius:10px;padding:7px}.price span{display:block;font-size:9px;color:var(--muted)}.price b{font-size:12px;color:#38572f;white-space:nowrap}.freeze{font-size:9px;color:#74806d;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.actions button,.dbtn{border-radius:11px;padding:9px 7px;font-size:10px;font-weight:900}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.primary{border:0;background:var(--green);color:#fff}
.bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:8px 7px calc(8px + env(safe-area-inset-bottom))}.nav{border:0;background:transparent;color:#777;font-size:10px;font-weight:800}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}.nav.active{color:var(--green)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}.top h3{margin:0;font-size:16px}.back{border:0;background:transparent;font-size:28px}.detail-photo{width:calc(100% + 28px);margin-left:-14px;height:290px;object-fit:cover;background:#eef3e9}.detail{padding:14px 2px}.detail h1{font-family:Georgia,serif;color:#34472e;font-size:29px;line-height:1.04;margin:9px 0 6px}.desc{font-size:13px;line-height:1.5;color:#666b63}.dprices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.dprice{border:1px solid #d7e3cf;border-radius:14px;padding:12px;text-align:center;background:#fff}.dprice span{display:block;font-size:10px;color:#70766b}.dprice b{display:block;font-size:20px;margin-top:3px}.info{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;line-height:1.5;margin:9px 0;font-size:12px}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.detail-actions button{border-radius:13px;padding:12px;font-weight:900}
.cartitem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}.cname{font-size:12px;font-weight:850}.small{font-size:10px;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:9px}.totalbox{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grand{font-size:22px;font-weight:900;color:var(--green)}.checkout{width:100%;border:0;border-radius:14px;background:var(--green);color:#fff;padding:14px;font-weight:900;margin-top:10px}.form{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.form label{display:block;font-size:11px;color:var(--muted);margin-bottom:11px}.form input,.form textarea{width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}.notice{background:#fff5e4;border:1px solid #ecd6ae;border-radius:14px;padding:11px;font-size:11px;line-height:1.45}.errorbox{background:#f9eaea;border:1px solid #e7c2c2;color:#8e3f3f}.order{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}.empty{text-align:center;padding:34px 15px;color:var(--muted)}.okmark{width:80px;height:80px;border-radius:50%;background:#e9f4df;display:grid;place-items:center;font-size:42px;color:var(--green);margin:28px auto 14px}.thanks{text-align:center}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:99;background:#232722;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}.toast.show{opacity:1}.toast.err{background:#a74747}.loading{text-align:center;padding:24px;color:var(--muted);font-size:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<section id="catalog" class="page active">
<header><div class="logo">⌂</div><div><div class="brand">Домашняя кухня</div><div class="tag">С любовью как дома ♡</div></div><button class="cartbtn" onclick="openCart()">🛒 <span id="cartCount">0</span></button></header>
<div class="sticky"><div class="status"><span id="status"><span class="dot"></span>Загружаю актуальный прайс…</span><button class="refresh" onclick="loadProducts()">Обновить</button></div><input id="q" class="search" placeholder="Поиск по каталогу…" oninput="renderCatalog()"><div id="filters" class="filters"></div></div>
<div class="head"><h2 id="catTitle">Каталог</h2><span id="catCount"></span></div><div id="grid" class="grid"><div class="loading" style="grid-column:1/-1">Загрузка…</div></div>
</section>
<section id="detail" class="page"><div id="detailContent"></div></section>
<section id="orders" class="page"><div class="top"><button class="back" onclick="go('catalog')">‹</button><h3>Мои заказы</h3><span></span></div><div id="ordersList"></div></section>
<section id="profile" class="page"><div class="top"><button class="back" onclick="go('catalog')">‹</button><h3>Профиль</h3><span></span></div><div class="form"><label>Имя<input id="pname" autocomplete="name"></label><label>Телефон / мессенджер<input id="pphone" autocomplete="tel"></label><div class="notice">Каталог и цены синхронизируются с хозяйским приложением.</div><button class="checkout" onclick="saveProfile()">Сохранить</button></div></section>
<section id="cartPage" class="page"><div id="cartContent"></div></section>
<section id="checkoutPage" class="page"><div id="checkoutContent"></div></section>
<section id="successPage" class="page"><div id="successContent"></div></section>
</div>
<nav class="bottom"><button class="nav active" data-page="catalog" onclick="go('catalog')"><i>▦</i>Каталог</button><button class="nav" data-page="orders" onclick="go('orders')"><i>🧾</i>Заказы</button><button class="nav" data-page="profile" onclick="go('profile')"><i>👤</i>Профиль</button></nav><div id="toast" class="toast"></div>
<script>
const API='https://zdxfxyesdlwzpdknapti.supabase.co/functions/v1/client-kitchen';
const PRODUCT_PHOTOS={"1":"assets/images/products/syrniki-classic-premium.png","2":"assets/images/products/syrniki-raisins-vanilla.png","3":"assets/images/products/syrniki-poppy.png","4":"assets/images/products/syrniki-cheese-herbs.png","5":"assets/images/products/blinchiki-cottage-cheese.png","6":"assets/images/products/blinchiki-ham-cheese.png","7":"assets/images/products/blinchiki-chicken-mushrooms.png","8":"assets/images/products/blinchiki-cabbage-onion.png","9":"assets/images/products/blinchiki-apple-cinnamon.png","10":"assets/images/products/pelmeni-home-pork-beef.png","11":"assets/images/products/pelmeni-pork-chicken.png","12":"assets/images/products/pelmeni-chicken-juicy.png","13":"assets/images/products/pelmeni-turkey.png","14":"assets/images/products/pelmeni-pork.png","15":"assets/images/products/vareniki-potato-fried-onion.png","16":"assets/images/products/vareniki-potato-mushrooms.png","17":"assets/images/products/vareniki-potato-bacon.png","18":"assets/images/products/vareniki-sweet-cottage-cheese.png","19":"assets/images/products/vareniki-cottage-herbs.png","20":"assets/images/products/cutlets-chicken-creamy.png","21":"assets/images/products/cutlets-chicken-cheese.png","22":"assets/images/products/cutlets-home-pork-chicken.png","23":"assets/images/products/cutlets-pork-juicy.png","24":"assets/images/products/meatballs-home-rice.png","25":"assets/images/products/meatballs-chicken.png","26":"assets/images/products/schnitzel-chicken.png","27":"assets/images/products/schnitzel-pork.png","28":"assets/images/products/nuggets-whole-fillet.png","29":"assets/images/products/zrazy-meat-mushrooms-cheese.png","30":"assets/images/products/meatballs-cream-cheese.png","31":"assets/images/products/meatballs-mushrooms-cheese.png","32":"assets/images/products/meat-nests-mushrooms-cheese.png","33":"assets/images/products/meat-nests-pineapple-cheese.png","34":"assets/images/products/cutlets-fish-creamy.png","35":"assets/images/products/cutlets-fish-spinach.png","36":"assets/images/products/cabbage-rolls-home-extra-filling.png","37":"assets/images/products/lazy-cabbage-rolls-juicy.png","38":"assets/images/products/stuffed-peppers-meat.png","39":"assets/images/products/stuffed-peppers-chicken-mushrooms-cheese.png","40":"assets/images/products/chebureki-home-meat.png","41":"assets/images/products/chebureki-chicken-cheese.png","42":"assets/images/products/mini-pizza-ham-cheese.png","43":"assets/images/products/mini-pizza-chicken-mushrooms.png","44":"assets/images/products/sausages-home-pork-chicken.png","45":"assets/images/products/sausages-chicken-cheese.png","46":"assets/images/products/chicken-rolls-cheese-spinach.png","47":"assets/images/products/chicken-pockets-julienne.png","48":"assets/images/products/meat-bombs-mozzarella.png","49":"assets/images/products/family-lasagna-semi-finished.png"};

let PRODUCTS=[],activeCat='Все';
let cart=JSON.parse(localStorage.getItem('hk_cart')||'[]');
let profile=JSON.parse(localStorage.getItem('hk_profile')||'{"name":"","phone":""}');
let orderRefs=JSON.parse(localStorage.getItem('hk_orders')||'[]');
const $=id=>document.getElementById(id), E={status:$('status'),q:$('q'),filters:$('filters'),catTitle:$('catTitle'),catCount:$('catCount'),grid:$('grid'),cartCount:$('cartCount'),detailContent:$('detailContent'),ordersList:$('ordersList'),cartContent:$('cartContent'),checkoutContent:$('checkoutContent'),successContent:$('successContent'),pname:$('pname'),pphone:$('pphone'),toast:$('toast')};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(n){return Number(n||0).toFixed(2).replace('.',',')+' р'}function getP(id){return PRODUCTS.find(x=>String(x.id)===String(id))}
function toast(m,err=false){E.toast.textContent=m;E.toast.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>E.toast.className='toast',2600)}
async function api(mode,options={}){const url=API+'?mode='+encodeURIComponent(mode)+(options.token?'&token='+encodeURIComponent(options.token):'');const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(url,{method:options.method||'GET',headers:{'Content-Type':'application/json'},body:options.body?JSON.stringify(options.body):undefined,signal:c.signal});const d=await r.json().catch(()=>null);if(!r.ok){const e=new Error(d?.error||('HTTP '+r.status));e.status=r.status;throw e}return d}finally{clearTimeout(t)}}
function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(page)?.classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));if(page==='orders')refreshOrders();if(page==='profile'){E.pname.value=profile.name||'';E.pphone.value=profile.phone||''}window.scrollTo({top:0,behavior:'smooth'})}
function renderFilters(){const cats=['Все',...new Set(PRODUCTS.map(x=>x.category).filter(Boolean))];E.filters.innerHTML=cats.map(c=>`<button class="filter ${c===activeCat?'active':''}" onclick='setCat(${JSON.stringify(c)})'>${esc(c)}</button>`).join('')}function setCat(c){activeCat=c;renderFilters();renderCatalog()}
function localProductPhoto(p){const relative=PRODUCT_PHOTOS[String(p?.id)]||'';if(!relative)return'';try{return new URL(relative,document.baseURI).href}catch{return relative}}
function image(p,detail=false){const src=localProductPhoto(p),cls=detail?'detail-photo':'photo';if(src)return `<img data-product-image="${esc(p.id)}" class="${cls}" src="${esc(src)}" alt="${esc(p.name)}">`;return `<div class="${detail?'detail-photo fallback':'fallback'}" data-product-image-missing="${esc(p.id)}" role="img" aria-label="Фото товара скоро">❄️</div>`}
function renderCatalog(){const q=(E.q.value||'').toLowerCase().trim(),arr=PRODUCTS.filter(p=>(activeCat==='Все'||p.category===activeCat)&&(!q||String(p.name||'').toLowerCase().includes(q)));E.catTitle.textContent=activeCat==='Все'?'Каталог':activeCat;E.catCount.textContent=arr.length+' поз.';E.grid.innerHTML=arr.length?arr.map(p=>`<article class="product">${image(p)}<div class="pbody"><span class="badge">${esc(p.assortment_status||'В продаже')}</span><div class="ptitle" onclick="openDetail('${p.id}')">${esc(p.name)}</div><div class="prices"><div class="price"><span>0,5 кг</span><b>${fmt(p.price_half)}</b></div><div class="price"><span>1 кг</span><b>${fmt(p.price_kg)}</b></div></div><div class="freeze">❄️ Замороженный продукт</div><div class="actions"><button class="secondary" onclick="openDetail('${p.id}')">Подробнее</button><button class="primary" onclick="add('${p.id}',500)">В корзину</button></div></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Сейчас нет опубликованных позиций</div>'}
function openDetail(id){const p=getP(id);if(!p)return;E.detailContent.innerHTML=`<div class="top"><button class="back" onclick="go('catalog')">‹</button><h3>Карточка продукта</h3><span></span></div>${image(p,true)}<div class="detail"><span class="badge">${esc(p.assortment_status||'В продаже')}</span><h1>${esc(p.name)}</h1><div class="desc">${esc(p.description||'Домашний замороженный полуфабрикат.')}</div><div class="dprices"><div class="dprice"><span>0,5 кг</span><b>${fmt(p.price_half)}</b><button class="checkout" onclick="add('${p.id}',500)">Добавить</button></div><div class="dprice"><span>1 кг</span><b>${fmt(p.price_kg)}</b><button class="checkout" onclick="add('${p.id}',1000)">Добавить</button></div></div><div class="info"><b>Как приготовить</b><br>${esc(p.instruction||p.client_instruction||'Готовить по инструкции хозяйки.')}</div><div class="info">❄️ Продукт передаётся в замороженном виде.</div><div class="detail-actions"><button class="secondary" onclick="shareProduct('${p.id}')">Поделиться</button><button class="primary" onclick="openCart()">Корзина</button></div></div>`;go('detail')}
function shareProduct(id){const p=getP(id);if(!p)return;const text=`Домашняя кухня\n${p.name}\n0,5 кг — ${fmt(p.price_half)}\n1 кг — ${fmt(p.price_kg)}`;if(navigator.share)navigator.share({title:'Домашняя кухня',text}).catch(()=>{});else navigator.clipboard?.writeText(text).then(()=>toast('Скопировано'))}
function add(id,grams=500){const p=getP(id);if(!p)return;let r=cart.find(x=>String(x.product_id)===String(id)&&x.grams===grams);if(r)r.qty++;else cart.push({product_id:p.id,grams,qty:1});saveCart();toast('Добавлено в корзину')}function saveCart(){localStorage.setItem('hk_cart',JSON.stringify(cart));E.cartCount.textContent=cart.reduce((s,x)=>s+x.qty,0)}
function total(){return cart.reduce((s,x)=>{const p=getP(x.product_id);if(!p)return s;return s+(x.grams===1000?Number(p.price_kg):Number(p.price_half))*x.qty},0)}
function openCart(){const rows=cart.map((x,i)=>{const p=getP(x.product_id);if(!p)return'';const u=x.grams===1000?p.price_kg:p.price_half;return `<div class="cartitem"><div><div class="cname">${esc(p.name)}</div><div class="small">${x.grams/1000} кг · ${fmt(u)} × ${x.qty}</div></div><div class="qty"><button onclick="qty(${i},-1)">−</button><b>${x.qty}</b><button onclick="qty(${i},1)">+</button></div></div>`}).join('');E.cartContent.innerHTML=`<div class="top"><button class="back" onclick="go('catalog')">‹</button><h3>Корзина</h3><span></span></div>${rows||'<div class="empty">Корзина пуста</div>'}${cart.length?`<div class="totalbox"><div class="row"><span>Итого</span><span class="grand">${fmt(total())}</span></div><button class="checkout" onclick="openCheckout()">Оформить заказ</button></div>`:''}`;go('cartPage')}function qty(i,d){if(!cart[i])return;cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);saveCart();openCart()}
function openCheckout(){E.checkoutContent.innerHTML=`<div class="top"><button class="back" onclick="openCart()">‹</button><h3>Оформление заказа</h3><span></span></div><div class="form"><label>Имя<input id="coName" value="${esc(profile.name||'')}" autocomplete="name"></label><label>Телефон / мессенджер<input id="coPhone" value="${esc(profile.phone||'')}" autocomplete="tel"></label><label>Комментарий<textarea id="coComment" rows="3" placeholder="Например: позвонить перед выдачей"></textarea></label><div class="notice">Цена и доступность повторно проверяются при создании заказа.</div><button id="submitOrder" class="checkout" onclick="checkout()">Подтвердить заказ · ${fmt(total())}</button></div>`;go('checkoutPage')}
async function checkout(){const name=($('coName')?.value||'').trim(),phone=($('coPhone')?.value||'').trim(),comment=($('coComment')?.value||'').trim();if(!name)return toast('Укажите имя',true);if(!phone)return toast('Укажите телефон',true);const btn=$('submitOrder');btn.disabled=true;btn.textContent='Отправляю…';try{const items=cart.map(x=>({product_id:x.product_id,grams:x.grams*x.qty}));const d=await api('order',{method:'POST',body:{customer:{name,phone},comment,items}});profile={name,phone};localStorage.setItem('hk_profile',JSON.stringify(profile));const ref={public_token:d.public_token,created_at:new Date().toISOString()};orderRefs.unshift(ref);localStorage.setItem('hk_orders',JSON.stringify(orderRefs));cart=[];saveCart();showSuccess(ref)}catch(e){toast(e.status===409?'Товара уже недостаточно. Обновите каталог.':'Не удалось отправить заказ',true);btn.disabled=false;btn.textContent='Повторить отправку'}}
function showSuccess(ref){E.successContent.innerHTML=`<div class="okmark">✓</div><div class="thanks"><h2>Заказ принят</h2><p>Хозяйка увидит его в своём приложении.</p><div class="info">Заказ сохранён. Статус можно проверить во вкладке «Заказы».</div><button class="checkout" onclick="go('orders')">Мои заказы</button><button class="checkout secondary" onclick="go('catalog')">Вернуться в каталог</button></div>`;go('successPage')}
function statusRu(s){return({pending:'Ожидает подтверждения',confirmed:'Подтверждён',needs_production:'Готовится',ready:'Готов',issued:'Выдан',cancelled:'Отменён'})[s]||s||'Ожидает'}
async function refreshOrders(){if(!orderRefs.length){E.ordersList.innerHTML='<div class="empty">Заказов пока нет</div>';return}E.ordersList.innerHTML='<div class="loading">Обновляю статусы…</div>';for(const r of orderRefs){try{r.order=await api('order',{token:r.public_token})}catch{}}localStorage.setItem('hk_orders',JSON.stringify(orderRefs));E.ordersList.innerHTML=orderRefs.map(r=>{const o=r.order||{};return `<div class="order"><div class="row"><b>Заказ ${esc(o.id||'')}</b><span class="badge">${esc(statusRu(o.status))}</span></div><div class="small">${new Date(r.created_at).toLocaleString('ru-RU')}</div>${o.total_amount!=null?`<div class="row" style="margin-top:9px"><span>Итого</span><b>${fmt(o.total_amount)}</b></div>`:''}</div>`}).join('')}
function saveProfile(){profile={name:E.pname.value.trim(),phone:E.pphone.value.trim()};localStorage.setItem('hk_profile',JSON.stringify(profile));toast('Сохранено')}
async function loadProducts(){E.status.innerHTML='<span class="dot"></span>Загружаю актуальный прайс…';try{const d=await api('catalog');PRODUCTS=Array.isArray(d)?d:(d.items||[]);PRODUCTS=PRODUCTS.map(p=>({...p,price_half:Number(p.price_half)||0,price_kg:Number(p.price_kg)||0}));E.status.innerHTML='<span class="dot ok"></span>Актуальный прайс';if(activeCat!=='Все'&&!PRODUCTS.some(x=>x.category===activeCat))activeCat='Все';renderFilters();renderCatalog();saveCart()}catch(e){console.error(e);E.status.innerHTML='<span class="dot bad"></span>Нет связи с каталогом';E.grid.innerHTML='<div class="notice errorbox" style="grid-column:1/-1">Не удалось загрузить прайс. Проверьте интернет и нажмите «Обновить».</div>';toast('Не удалось загрузить каталог',true)}}
saveCart();loadProducts();
</script>
</body>
</html>
