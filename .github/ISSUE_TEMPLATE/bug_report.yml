name: Bug report
description: Report a reproducible problem in the public project.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not include passwords, API keys, tokens, private endpoints or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear, reproducible description.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/device/OS or Node version, if relevant.
      placeholder: Chrome 140 / Android 16 / Node 22
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, logs or public links are welcome. Remove sensitive information first.
