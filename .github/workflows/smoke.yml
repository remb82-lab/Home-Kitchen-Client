name: Client Smoke Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'premium-client.css'
      - 'premium-client-adapter.js'
      - 'assets/**'
      - 'smoke.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run client smoke
        run: node smoke.mjs
