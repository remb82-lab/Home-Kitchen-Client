name: Client Smoke Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/smoke.yml'
      - 'scripts/build-public-pwa.sh'
      - 'smoke.mjs'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'app-sw.js'
      - 'app-shell.js'
      - 'app-shell.css'
      - 'premium-client.css'
      - 'premium-client-adapter.js'
      - 'client-repeat-order-adapter.js'
      - 'data/**'
      - 'runtime/**'
      - 'services/**'
      - 'security/**'
      - 'contact/**'
      - 'catalog/**'
      - 'cart/**'
      - 'checkout/**'
      - 'orders/**'
      - 'profile/**'
      - 'app/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source and live catalog
        run: node smoke.mjs

      - name: Build candidate exactly like Pages
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-public-pwa.sh
          scripts/build-public-pwa.sh

      - name: Verify built client package
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/manifest.webmanifest
          test -s _site/app-sw.js
          test -s _site/services/client-api.js
          test -s _site/security/turnstile.js
          test -s _site/checkout/checkout-controller.js
          test -s _site/assets/branding/home-kitchen-mark.svg
          grep -q '/functions/v1/create-client-order' _site/services/client-api.js
          grep -q '0x4AAAAAAEvNfqWeNAvsAKeB' _site/security/turnstile.js
          grep -q 'turnstile_token' _site/checkout/checkout-controller.js
          grep -q 'v15' _site/app-sw.js
          ! grep -R -q 'client-kitchen?mode=order' _site --exclude-dir=assets
          ! grep -R -q 'TURNSTILE_SECRET_KEY' _site

      - name: Start static preview
        shell: bash
        working-directory: _site
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/home-kitchen-client-smoke.log 2>&1 &
          echo $! >/tmp/home-kitchen-client-smoke.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/home-kitchen-client-smoke.log
          exit 1

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4173/index.html | grep -q 'security/turnstile.js'
          curl -fsS http://127.0.0.1:4173/services/client-api.js | grep -q '/functions/v1/create-client-order'
          curl -fsS http://127.0.0.1:4173/security/turnstile.js | grep -q '0x4AAAAAAEvNfqWeNAvsAKeB'
          curl -fsS http://127.0.0.1:4173/app-sw.js | grep -q 'v15'

      - name: Stop static preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/home-kitchen-client-smoke.pid ]; then kill "$(cat /tmp/home-kitchen-client-smoke.pid)" || true; fi
