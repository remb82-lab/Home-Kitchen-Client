name: Client Smoke Gate

on:
  push:
    branches:
      - 'factory/pages-self-contained-twa-*'
      - 'factory/client-1kg-only-*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/smoke.yml'
      - 'scripts/build-public-pwa.sh'
      - 'smoke.mjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw-public.js'
      - 'premium-client.css'
      - 'premium-client-adapter.js'
      - 'kg-only.js'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source and live catalog
        run: node smoke.mjs

      - name: Build candidate exactly like Pages
        shell: bash
        run: |
          chmod +x scripts/build-public-pwa.sh
          scripts/build-public-pwa.sh

      - name: Verify built client package
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/premium-client.css
          test -s _site/premium-client-adapter.js
          test -s _site/kg-only.js
          test -s _site/manifest.webmanifest
          test -s _site/icon.svg
          test -s _site/sw.js
          test -s _site/assets/images/placeholders/product-photo-placeholder-c-v2.1.svg
          test -s _site/assets/products/syrniki-classic-premium.webp
          test -s _site/assets/products/syrniki-raisins-vanilla.webp
          test -s _site/assets/images/products/syrniki-poppy.webp
          test -s _site/assets/images/products/cutlets-chicken-creamy.webp
          test ! -e _site/assets/images/products/syrniki-poppy.png
          grep -q 'rel="manifest"' _site/index.html
          grep -q 'premium-client.css' _site/index.html
          grep -q 'premium-client-adapter.js' _site/index.html
          grep -q 'kg-only.js' _site/index.html
          grep -q 'data-hk-pwa-registration' _site/index.html
          grep -q '"display": "standalone"' _site/manifest.webmanifest
          grep -q 'home-kitchen-client-public-20260828-v5' _site/sw.js
          grep -q 'hk-kg-only-v1' _site/kg-only.js

      - name: Start static preview
        shell: bash
        working-directory: _site
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/home-kitchen-client-smoke.log 2>&1 &
          echo $! >/tmp/home-kitchen-client-smoke.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/home-kitchen-client-smoke.log
          exit 1

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4173/index.html -o /tmp/home-kitchen-index.html
          grep -q 'rel="manifest"' /tmp/home-kitchen-index.html
          grep -q 'kg-only.js' /tmp/home-kitchen-index.html
          curl -fsS http://127.0.0.1:4173/manifest.webmanifest -o /tmp/manifest.webmanifest
          grep -q '"display": "standalone"' /tmp/manifest.webmanifest
          curl -fsS http://127.0.0.1:4173/sw.js -o /tmp/sw.js
          grep -q 'home-kitchen-client-public-20260828-v5' /tmp/sw.js
          curl -fsS http://127.0.0.1:4173/premium-client.css -o /tmp/premium-client.css
          grep -q 'Premium Home Market' /tmp/premium-client.css
          curl -fsS http://127.0.0.1:4173/premium-client-adapter.js -o /tmp/premium-client-adapter.js
          grep -q 'PRODUCT_PLACEHOLDER' /tmp/premium-client-adapter.js
          curl -fsS http://127.0.0.1:4173/assets/products/syrniki-classic-premium.webp -o /tmp/product-1.webp
          test -s /tmp/product-1.webp
          curl -fsS http://127.0.0.1:4173/assets/products/syrniki-raisins-vanilla.webp -o /tmp/product-2.webp
          test -s /tmp/product-2.webp
          curl -fsS http://127.0.0.1:4173/assets/images/products/syrniki-poppy.webp -o /tmp/product-3.webp
          test -s /tmp/product-3.webp
          curl -fsS http://127.0.0.1:4173/assets/images/products/cutlets-chicken-creamy.webp -o /tmp/product-20.webp
          test -s /tmp/product-20.webp
          curl -fsS http://127.0.0.1:4173/kg-only.js -o /tmp/kg-only.js
          grep -q 'hk-kg-only-v1' /tmp/kg-only.js
          grep -q 'grams:1000' /tmp/kg-only.js

      - name: Stop static preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/home-kitchen-client-smoke.pid ]; then
            kill "$(cat /tmp/home-kitchen-client-smoke.pid)" || true
          fi
