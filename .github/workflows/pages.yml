name: Deploy Home Kitchen Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HOME_KITCHEN_SOURCE_REPOSITORY: remb82-lab/Home-Kitchen
  HOME_KITCHEN_SOURCE_SHA: 9d81ae12c044d1ec32a0773bb1c7fc083e28c8d2

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout approved central client source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOME_KITCHEN_SOURCE_REPOSITORY }}
          ref: ${{ env.HOME_KITCHEN_SOURCE_SHA }}
          path: _source

      - name: Verify pinned source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _source rev-parse HEAD)" = "$HOME_KITCHEN_SOURCE_SHA"

      - name: Build approved PWA site
        shell: bash
        run: |
          chmod +x scripts/build-central-pwa.sh
          scripts/build-central-pwa.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
