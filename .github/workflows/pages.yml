name: Deploy Home Kitchen Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HOME_KITCHEN_SOURCE_REPOSITORY: remb82-lab/Home-Kitchen
  HOME_KITCHEN_SOURCE_SHA: 9d81ae12c044d1ec32a0773bb1c7fc083e28c8d2

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout approved central client source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOME_KITCHEN_SOURCE_REPOSITORY }}
          ref: ${{ env.HOME_KITCHEN_SOURCE_SHA }}
          path: _source

      - name: Build Pages site from approved central source
        shell: bash
        run: |
          set -euo pipefail
          test -d _source/apps/client/web
          rm -rf _site
          mkdir -p _site
          rsync -a _source/apps/client/web/ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/premium-client.css
          test -s _site/premium-client-adapter.js
          test -s _site/assets/images/placeholders/product-photo-placeholder-c-v2.1.svg
          test -s _site/assets/branding/home-kitchen-mark.svg
          test -s _site/assets/icons/home-kitchen-ui.svg
          grep -q './premium-client.css' _site/index.html
          grep -q './premium-client-adapter.js' _site/index.html
          grep -q 'home-kitchen-ui.svg' _site/premium-client-adapter.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
