name: Temporary Pages preview product photos

on:
  push:
    branches:
      - 'factory/pages-self-contained-twa-product-photos-20260828'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployment candidate
        uses: actions/checkout@v4
      - name: Build candidate PWA
        shell: bash
        run: |
          chmod +x scripts/build-public-pwa.sh
          scripts/build-public-pwa.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
