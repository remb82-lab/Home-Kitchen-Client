name: Temporary optimize product photos

on:
  push:
    branches:
      - 'factory/pages-self-contained-twa-product-photo-hotfix-20260828'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install WebP encoder
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
      - name: Create optimized WebP derivatives
        shell: bash
        run: |
          set -euo pipefail
          dir='assets/images/products'
          count=0
          total_png=0
          total_webp=0
          for src in "$dir"/*.png; do
            base="${src%.png}"
            name="$(basename "$src")"
            if [ "$name" = "syrniki-classic-premium.png" ] || [ "$name" = "syrniki-raisins-vanilla.png" ]; then
              continue
            fi
            dst="$base.webp"
            cwebp -quiet -q 78 -m 6 -mt -resize 900 0 "$src" -o "$dst"
            test -s "$dst"
            count=$((count+1))
            png_size=$(stat -c%s "$src")
            webp_size=$(stat -c%s "$dst")
            total_png=$((total_png+png_size))
            total_webp=$((total_webp+webp_size))
          done
          test "$count" = "47"
          echo "WEBP_COUNT=$count"
          echo "PNG_BYTES=$total_png"
          echo "WEBP_BYTES=$total_webp"
          test "$total_webp" -lt "$total_png"
      - name: Commit optimized derivatives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/products/*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf(client): add optimized product webp derivatives"
          git push origin HEAD:"${GITHUB_REF_NAME}"
